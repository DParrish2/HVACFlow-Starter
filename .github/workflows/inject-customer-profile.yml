name: Wire customer profile UI

on:
  push:
    branches: [main]
    paths:
      - customer-profile.js
      - .github/workflows/inject-customer-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add customer profile script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '<script src="/customer-profile.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              p.write_text(text)
          PY
      - name: Commit production wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load customer profile navigation"
          git push
