name: Wire HVACFlow UI helpers

on:
  push:
    branches: [main]
    paths:
      - customer-profile.js
      - customer-linking.js
      - address-maps.js
      - team-members.js
      - plan-descriptions.js
      - website-leads.js
      - job-notes-contractors.js
      - login-separation.js
      - .github/workflows/inject-customer-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add HVACFlow helper scripts to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tags = [
              '<script src="/customer-profile.js"></script>',
              '<script src="/customer-linking.js"></script>',
              '<script src="/address-maps.js"></script>',
              '<script src="/team-members.js"></script>',
              '<script src="/plan-descriptions.js"></script>',
              '<script src="/website-leads.js"></script>',
              '<script src="/job-notes-contractors.js"></script>',
              '<script src="/login-separation.js"></script>',
          ]
          changed = False
          for tag in tags:
              if tag not in text:
                  text = text.replace('</body>', tag + '\n</body>')
                  changed = True
          if changed:
              p.write_text(text)
          PY
      - name: Commit production wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load HVACFlow customer, team, plans, leads, job, and login helpers"
          git push
